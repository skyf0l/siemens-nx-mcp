minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        # Shared fixtures and fakes, not test modules.
        exclude: ^tests/(kit/|core/(fakes|tools)\.py$|fakes/|unit/[^/]+/(fakes|support)\.py$)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: capability-matrix
        name: capability matrix matches catalogue evidence
        entry: python scripts/generate_capability_matrix.py --check
        language: system
        pass_filenames: false
        files: ^(src/nx_mcp/evidence/.*\.json|src/nx_mcp/domains/.*\.py|scripts/generate_capability_matrix\.py|docs/capability-matrix\.md)$
      - id: tool-reference
        name: tool reference matches the catalogue
        entry: python scripts/generate_tool_reference.py --check
        language: python
        additional_dependencies: ["pydantic>=2.11,<3"]
        pass_filenames: false
        files: ^(src/nx_mcp/evidence/.*\.json|src/nx_mcp/domains/.*\.py|src/nx_mcp/core/(catalogue|types)\.py|src/nx_mcp/sidecar/schema\.py|scripts/generate_tool_reference\.py|docs/tools\.md)$
      - id: pytest
        name: pytest (non-real-NX)
        entry: python -m pytest -q -p no:cacheprovider -m "not real_nx"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mypy
        name: mypy sidecar
        entry: python -m mypy src/nx_mcp
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
