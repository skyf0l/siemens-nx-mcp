[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-mcp"
dynamic = ["version"]
description = "MCP server for Siemens NX (UG) CAD operations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/skyf0l/siemens-nx-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.11,<2",
    "pre-commit>=3.5",
]

[project.scripts]
nx-mcp = "nx_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "nx_mcp.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
markers = [
    "real_nx: requires a dedicated Windows runner with Siemens NX and a started bridge",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["nx_mcp"]

[tool.coverage.report]
fail_under = 78
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nx_mcp"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# NXOpen is injected at runtime inside NX; treat it as untyped rather than erroring.
module = "NXOpen.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# core.tx.Services documents the NX-side seam with empty method stubs; each concrete
# services class implements the members it needs.
module = "nx_mcp.core.tx"
disable_error_code = ["empty-body"]

[tool.setuptools.package-data]
nx_mcp = [
    "evidence/*.json",
]
